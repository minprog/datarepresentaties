templates:
    1: &aftekenen
        subgrades:
            akkoord: boolean
        calculation: akkoord
    2: &automatisch_aftekenen
        subgrades:
            checks: boolean
        calculation: checks
        hide_subgrades: true
        automatic:
            checks: -(correctness_score.floor)
        auto_publish: true
    3: &punten
        type: points
        subgrades:
            punten: integer
        calculation: punten
    4: &tentamen
        subgrades:
            commands: integer
            oneliners: integer
            binair: integer
            regex: integer
            scraping: integer
            database: integer
        calculation: commands + oneliners + binair + regex + scraping + database

grades:
    computing: *aftekenen
    besturingssystemen: *aftekenen
    representaties: *aftekenen
    internet: *aftekenen

    html_for_people: *punten

    pidac_1: *aftekenen
    pidac_2: *aftekenen
    pidac_3: *aftekenen

    movies: *automatisch_aftekenen
    fiftyville: *automatisch_aftekenen

    tentamen: *tentamen
    hertentamen: *tentamen

practicum:
    show_progress: true
    type: points
    submits:
        pidac_1: 2
        pidac_2: 2
        pidac_3: 2

portfolio:
