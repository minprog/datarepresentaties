templates:
    1: &aftekenen
        type: points
        subgrades:
            akkoord: boolean
        calculation: akkoord
    2: &automatisch_aftekenen
        subgrades:
            checks: boolean
        calculation: checks
        hide_subgrades: true
        automatic:
            checks: -(correctness_score.floor)
        auto_publish: true
    3: &tentamen
        type: points
        is_test: true
        subgrades:
            commands: integer
            oneliners: integer
            representaties: integer
            regex: integer
            scraping: integer
            databases: integer
        calculation: sum_all
        hide_calculated: true

grades:
    computing: *aftekenen
    besturingssystemen: *aftekenen
    representaties: *aftekenen
    llms: *aftekenen

    html_for_people: *aftekenen

    pidac:
        type: points
        is_test: true
        subgrades:
            sessie_1: boolean
            sessie_2: boolean
            sessie_3: boolean
        calculation: count_all * 2

    movies: *automatisch_aftekenen
    fiftyville: *automatisch_aftekenen

    tentamen: *tentamen
    hertentamen: *tentamen

practicum:
    show_progress: true
    type: points
    submits:
        pidac: 6

website:
    show_progress: true
    type: points
    submits:
        html_for_people: 6

schrijfopdrachten:
    show_progress: true
    type: pass_all
    submits:
        - computing
        - besturingssystemen
        - representaties
        - llms

sql:
    show_overview: true
    submits:
        movies: 1
        fiftyville: 1

tentamen:
    show_progress: true
    type: points
    attempt_required: true
    submits:
        tentamen: 36

hertentamen:
    show_progress: true
    type: points
    attempt_required: true
    submits:
        hertentamen: 36

calculation:
    eindcijfer:
        practicum: 6
        website: 6
        schrijfopdrachten: 0
        tentamen: 36
    herkansingscijfer:
        practicum: 6
        website: 6
        schrijfopdrachten: 0
        hertentamen: 36
